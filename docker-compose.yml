services:
  api:
    build: .
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_POSTGRES_DB_HOST: db
      APP_MONGODB_DB_ATLAS_URI: mongodb://root:golang-first-api@mongodb:27017/?authSource=admin
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: golang-first-api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6.0.8
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: golang-first-api
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
